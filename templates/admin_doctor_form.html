{% extends "base.html" %}

{% block title %}Edit Doctor | Medico{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <div class="max-w-3xl mx-auto">
        <div class="mb-8">
            <p class="text-[10px] font-bold text-primary/40 uppercase tracking-widest mb-2">Doctor Management</p>
            <h1 class="text-4xl font-serif font-bold text-primary">Update Doctor Profile</h1>
        </div>

        <div class="glass rounded-[2rem] p-8 border-white/40 shadow-2xl">
            <form method="POST" action="{{ url_for('admin_edit_doctor', doctor_id=doctor._id) }}" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-primary/40 uppercase tracking-widest">Doctor Name</label>
                        <input type="text" name="name" value="{{ doctor.name or '' }}" class="w-full px-4 py-3 rounded-2xl border border-primary/10 bg-white/60 text-sm text-primary focus:ring-2 focus:ring-secondary/20 outline-none" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-primary/40 uppercase tracking-widest">Email</label>
                        <input type="email" name="email" value="{{ doctor.email or '' }}" class="w-full px-4 py-3 rounded-2xl border border-primary/10 bg-white/60 text-sm text-primary focus:ring-2 focus:ring-secondary/20 outline-none" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-primary/40 uppercase tracking-widest">Specialization</label>
                        <input type="text" name="specialization" value="{{ doctor.specialization or '' }}" class="w-full px-4 py-3 rounded-2xl border border-primary/10 bg-white/60 text-sm text-primary focus:ring-2 focus:ring-secondary/20 outline-none" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-primary/40 uppercase tracking-widest">City</label>
                        <input type="text" name="city" value="{{ doctor.city or '' }}" class="w-full px-4 py-3 rounded-2xl border border-primary/10 bg-white/60 text-sm text-primary focus:ring-2 focus:ring-secondary/20 outline-none" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-primary/40 uppercase tracking-widest">Hospital</label>
                        <input type="text" name="hospital_name" value="{{ doctor.hospital_name or '' }}" class="w-full px-4 py-3 rounded-2xl border border-primary/10 bg-white/60 text-sm text-primary focus:ring-2 focus:ring-secondary/20 outline-none" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-primary/40 uppercase tracking-widest">Consultation Fee</label>
                        <input type="number" name="consultation_fee" value="{{ doctor.consultation_fee or 0 }}" class="w-full px-4 py-3 rounded-2xl border border-primary/10 bg-white/60 text-sm text-primary focus:ring-2 focus:ring-secondary/20 outline-none" required>
                    </div>
                </div>

                <div class="space-y-2 max-w-xs">
                    <label class="text-[10px] font-bold text-primary/40 uppercase tracking-widest">Rating</label>
                    <input type="number" step="0.1" min="0" max="5" name="rating" value="{{ doctor.rating or 0 }}" class="w-full px-4 py-3 rounded-2xl border border-primary/10 bg-white/60 text-sm text-primary focus:ring-2 focus:ring-secondary/20 outline-none" required>
                </div>

                <div class="flex flex-wrap gap-4 pt-4">
                    <button type="submit" class="px-6 py-3 rounded-2xl bg-primary text-white font-bold">Save Changes</button>
                    <a href="{{ url_for('admin_doctor_detail', doctor_id=doctor._id) }}" class="px-6 py-3 rounded-2xl border border-primary/10 text-primary font-bold">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
